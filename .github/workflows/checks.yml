name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The causal extra carries econml and causalml. The tests that need them
      # call pytest.importorskip, so a wheel-less platform skips rather than fails.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz,causal]"

      # The same gate as `make check`, so local and CI cannot drift.
      - name: Check
        run: make check
