[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "causal-uplift-marketing"
version = "0.1.0"
description = "RCT-benchmarked causal inference and uplift modeling for marketing targeting"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
]

[project.optional-dependencies]
causal = [
  "econml>=0.16,<0.17",
  "causalml>=0.16,<0.17",
]
viz = [
  "graphviz>=0.20",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "streamlit>=1.40",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/causal_uplift"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
