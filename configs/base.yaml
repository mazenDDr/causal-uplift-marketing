project:
  seed: 42
  evaluation_fraction: 0.40

data:
  raw_path: data/raw/hillstrom.csv
  campaign: Mens E-Mail
  control: No E-Mail
  primary_outcome: conversion
  secondary_outcomes:
    - visit
    - spend

confounding:
  clip_min: 0.05
  clip_max: 0.95
  strengths:
    randomized: 0.0
    weak: 0.5
    medium: 1.0
    strong: 2.0
  coefficients:
    history: 0.55
    recency: -0.45
    mens: 0.65
    multichannel: 0.45
    newbie: -0.35

propensity:
  overlap_min: 0.05
  overlap_max: 0.95
  max_iter: 2000

matching:
  overlap_min: 0.05
  overlap_max: 0.95
  caliper_sd: 0.2
  bootstrap_samples: 2000
  variants:
    - with_replacement
    - without_replacement

dml:
  cross_fit_folds: 5
  nuisance_candidates:
    - random_forest_logistic
    - hist_gradient_boosting
  random_forest_trees: 200
  min_samples_leaf: 100
  max_iter: 200

causal_forest:
  training_sample: medium
  n_estimators: 400
  min_samples_leaf: 100
  max_depth: 12
  max_samples: 0.45
  max_features: 0.7
  subforest_size: 4
  honest: true
  cate_bins: 10

uplift_models:
  training_sample: medium
  control_name: control
  treatment_name: mens_email
  evaluation_function: KL
  honesty: true
  estimation_sample_size: 0.5
  tree:
    max_depth: 4
    min_samples_leaf: 250
    min_samples_treatment: 100
    n_reg: 100
  forest:
    n_estimators: 200
    max_depth: 5
    max_features: 8
    min_samples_leaf: 200
    min_samples_treatment: 100
    n_reg: 100
    n_jobs: -1
  cate_bins: 10

uplift_metrics:
  fractions: [0.00, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50,
              0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00]
  bootstrap_samples: 1000
  reference_model: response_model

evaluation:
  bootstrap_samples: 2000
  policy_budgets: [0.05, 0.10, 0.20, 0.30, 0.40, 0.50, 0.75, 1.00]
  email_costs: [0.01, 0.05, 0.10, 0.25, 0.50]
